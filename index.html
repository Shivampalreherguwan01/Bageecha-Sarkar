<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जय बगीचा सरकार</title>
    <style>
        body {
            background-color: #ffeadb;
            font-family: 'Arial', sans-serif;
            margin: 0;
            text-align: center;
            color: #4a0e0e;
        }
        .header {
            background: linear-gradient(orange, red);
            color: white;
            padding: 20px;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }
        .mandir-photo {
            width: 90%;
            max-width: 600px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 0 20px orange;
        }
        .section {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .pooja-item {
            display: inline-block;
            width: 100px;
            margin: 10px;
        }
        .pooja-item img { width: 80px; height: 80px; border-radius: 5px; }
        .btn-dan {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        /* Admin Login Style */
        .admin-btn { margin-top: 50px; font-size: 12px; color: grey; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">🚩 जय श्री राम 🚩<br>जय बगीचा सरकार</div>

    <img src="https://via.placeholder.com/600x400?text=Bageecha+Sarkar+Photo" alt="Mandir" class="mandir-photo">

    <div class="section">
        <h2>🙏 ऑनलाइन पूजा सामग्री</h2>
        <div class="pooja-item">
            <img src="https://via.placeholder.com/80/nariyal" alt="Nariyal">
            <p>नारियल<br>₹20</p>
        </div>
        <div class="pooja-item">
            <img src="https://via.placeholder.com/80/mithai" alt="Mithai">
            <p>मिठाई<br>₹10</p>
        </div>
        <div class="pooja-item">
            <img src="https://via.placeholder.com/80/agarbatti" alt="Agarbatti">
            <p>अगरबत्ती<br>₹2</p>
        </div>
        <br>
        <a href="upi://pay?pa=9343747271@ybl&pn=Bageecha Sarkar&cu=INR" class="btn-dan">पैसे दान करें / पूजा करें</a>
    </div>

    <div class="section">
        <h3>📸 फोटो/वीडियो अपलोड करें</h3>
        <input type="file" id="fileInput" accept="image/*,video/*">
        <button onclick="alert('File Received!')">Upload</button>
        <div id="gallery" style="margin-top: 20px;">
            <p>अभी कोई फोटो नहीं है।</p>
        </div>
    </div>

    <div class="section">
        <h3>📍 मंदिर की लोकेशन</h3>
        <a href="https://www.google.com/maps" target="_blank">Google Maps पर देखें</a>
    </div>

    <div class="section">
        <h3>🏆 दानदाताओं की सूची</h3>
        <ul id="donorsList" style="list-style: none; padding: 0;">
            <li>🥇 शिवम पाल - ₹501</li>
        </ul>
    </div>

    <div class="admin-btn" onclick="checkAdmin()">Admin Login</div>

    <script>
        function checkAdmin() {
            var pass = prompt("कृपया एडमिन पासवर्ड डालें:");
            if (pass == "9343747271Shivam") {
                alert("Welcome Shivam! अब आप बदलाव कर सकते हैं।");
                // यहाँ हम एडमिन फीचर्स खोल सकते हैं
            } else {
                alert("गलत पासवर्ड!");
            }
        }
    </script>

</body>
</html>
