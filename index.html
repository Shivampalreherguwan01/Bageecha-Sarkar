<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जय बगीचा सरकार</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #ff9933;
            background-image: linear-gradient(rgba(255, 153, 51, 0.8), rgba(255, 87, 34, 0.9)), 
                              url('https://images.unsplash.com/photo-1544013583-e74f8774773a?q=80&w=1000');
            background-size: cover; background-attachment: fixed;
            color: white; font-family: 'Arial', sans-serif; text-align: center;
        }
        .section { background: rgba(0, 0, 0, 0.3); margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .upload-box { background: white; color: black; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .gallery-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .gallery-display img, .gallery-display video { width: 140px; height: 140px; object-fit: cover; border-radius: 10px; border: 2px solid gold; }
        .btn-pay { background: #d32f2f; color: white; padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-block; margin: 10px; }
        .admin-icon { position: fixed; bottom: 20px; right: 20px; font-size: 24px; cursor: pointer; opacity: 0.7; }
    </style>
</head>
<body>

    <div style="padding: 20px;">
        <h1>🚩 जय बगीचा सरकार 🚩</h1>
        <p>करेरा, मध्य प्रदेश</p>
    </div>

    <div class="section">
        <h3>📸 अपनी गैलरी से फोटो/वीडियो डालें</h3>
        <div class="upload-box">
            <input type="file" id="fileInput" accept="image/*,video/*" multiple style="margin-bottom: 10px;">
            <br>
            <button onclick="uploadFiles()" style="background: orange; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">Upload Now</button>
        </div>
        <div class="gallery-display" id="gallery">
            </div>
    </div>

    <div class="section">
        <h3>🙏 ऑनलाइन सेवा</h3>
        <p>नारियल: ₹20 | मिठाई: ₹10 | अगरबत्ती: ₹2</p>
        <a href="upi://pay?pa=9343747271@ybl&pn=Bageecha Sarkar&cu=INR" class="btn-pay">पैसे दान करें (UPI)</a>
    </div>

    <div class="admin-icon" onclick="openAdmin()">🔒</div>

    <script>
        // गैलरी फंक्शन
        function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const gallery = document.getElementById('gallery');
            
            const files = fileInput.files;
            if (files.length === 0) { alert("कृपया फोटो या वीडियो चुनें!"); return; }

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function(e) {
                    let element;
                    if (file.type.startsWith('image/')) {
                        element = document.createElement('img');
                    } else if (file.type.startsWith('video/')) {
                        element = document.createElement('video');
                        element.controls = true;
                    }
                    element.src = e.target.result;
                    gallery.appendChild(element);
                };
                reader.readAsDataURL(file);
            }
            alert("अपलोड सफल! (अभी यह सिर्फ आपके फोन पर दिखेगा, स्थायी सेव के लिए डेटाबेस चाहिए)");
        }

        function openAdmin() {
            let pass = prompt("एडमिन पासवर्ड डालें:");
            if (pass === "9343747271Shivam") {
                alert("नमस्ते शिवम! आप अब एडमिन मोड में हैं।");
                // यहाँ आप ब्लॉक करने या बैकग्राउंड बदलने की कोडिंग जोड़ सकते हैं
            } else { alert("गलत पासवर्ड!"); }
        }
    </script>
</body>
        </html>
